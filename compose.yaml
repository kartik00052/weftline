services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weftline
      POSTGRES_USER: weftline
      POSTGRES_PASSWORD: weftline
    ports:
      - "5432:5432"
    volumes:
      - weftline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weftline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  weftline-pgdata: